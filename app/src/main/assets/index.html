const currentRPM=()=>st.preview?(st.scenario==='Acelerando'?3250:st.scenario==='Em movimento'?2150:820):(st.nativeConnected&&Number.isFinite(st.live.rpm)?st.live.rpm:null);
const currentSpeed=()=>st.preview?(st.scenario==='Parado'?0:st.scenario==='Acelerando'?73:48):(st.nativeConnected&&Number.isFinite(st.live.speed)?st.live.speed:null);
const currentAC=()=>st.preview?(st.acRequested&&st.pressureOK?'Liberado':st.acRequested?'Bloqueado':'Em espera'):(st.nativeConnected?(st.live.acPermit===true?'Liberado':st.live.acPermit===false?'Bloqueado':'Sem leitura'):'Sem leitura');

function currentPressure(){
 if(st.preview)return st.pressureOK?12.4:null;
 if(!st.nativeConnected || st.live.sensorOK!==true)return null;
 const p=st.live.pressure;
 return typeof p==='number'&&Number.isFinite(p)?p:null;
}
const pressureText=()=>currentPressure()===null?'—':currentPressure().toFixed(1);
// Historico RX/TX do protocolo Bluetooth: nao confundir com trafego CAN TX.
function captureLog(direction,line){
 if(st.logPaused)return;
 const raw=String(line??'').slice(0,18000);
 st.monitorHistory.push({seq:++st.logSeq,ts:new Date().toISOString(),direction,line:raw});
 if(st.monitorHistory.length>1200)st.monitorHistory.splice(0,st.monitorHistory.length-1200);
 updateMonitor();
}
function exportJson(name,obj){
 const payload=JSON.stringify(obj,null,2);
 if(window.AndroidBridge){window.AndroidBridge.saveText(name,payload);return;}
 const blob=new Blob([payload],{type:'application/json'}),url=URL.createObjectURL(blob);
 const a=document.createElement('a');a.href=url;a.download=name;a.click();
 setTimeout(()=>URL.revokeObjectURL(url),1000);toast('Arquivo JSON gerado');
}
function exportMonitor(){
 const data={format:'stilo-overboost-bluetooth-monitor',app:'0.4.2',firmware:st.live.fw||null,device:st.gatewayName||null,created_at:new Date().toISOString(),origin:'android-bluetooth-spp',limit:1200,notes:'RX = mensagens textuais do ESP32; TX = comandos escritos pelo Android. Nao representa TX CAN nem captura integral do barramento.',entries:st.monitorHistory};
 exportJson('stilo-overboost-monitor-rx-tx.json',data);
}
function exportCanCapture(){

}
function logRows(){
 const list=st.monitorHistory.filter(x=>st.logFilter==='ALL'||st.logFilter===x.direction).slice(-60).reverse();
 if(!list.length)return '<p class="note">Nenhuma mensagem nesta sessao. Conecte o gateway e aguarde o STATUS.</p>';
 return list.map(x=>`<details class="log-entry"><summary><span class="log-direction ${x.direction.toLowerCase()}">${x.direction}</span><span class="log-time">${esc(x.ts.slice(11,23))}</span><code>${esc(x.line.slice(0,95))}${x.line.length>95?'…':''}</code></summary><pre>${esc(x.line)}</pre></details>`).join('');
}
function updateMonitor(){
 if(st.selected!=='monitor')return;
 const counter=$('logCounter');if(counter)counter.textContent=st.monitorHistory.length+' mensagens (limite 1200)';
 const area=$('logRecords');if(area)area.innerHTML=logRows();
}
function monitor(){return `${label('Monitor Bluetooth RX / TX','monitor')}
 <div class="card"><p class="note bottom-gap">Veja o que o aplicativo realmente ENVIOU (TX) e RECEBEU (RX) do ESP32. Clique numa mensagem para ver o JSON completo. O historico fica nesta sessao; exporte antes de fechar.</p>
 <div class="statusline"><span>Conexao</span><strong>${st.nativeConnected?'Conectado a '+esc(st.gatewayName):'Offline'}</strong></div>
 <div class="statusline"><span>Firmware</span><strong>${esc(st.live.fw||'Aguardando')}</strong></div>
 <div class="statusline"><span>Pressao recebida</span><strong id="logPressureText">${pressureText()} bar</strong></div>
 <div class="actions top-space"><button class="btn primary" data-action="monitor-export">Exportar log RX/TX</button><button class="btn secondary" data-action="monitor-pause">${st.logPaused?'Retomar registro':'Pausar registro'}</button><button class="btn ghost" data-action="monitor-clear">Limpar historico</button></div>
 <div class="actions top-space"><button class="btn secondary" data-action="monitor-status">Solicitar STATUS</button><button class="btn secondary" data-action="monitor-can">Solicitar CAN LIST</button><button class="btn ghost" data-route="settings">Voltar aos ajustes</button></div>
 <div class="statusline top-space"><span id="logCounter">${st.monitorHistory.length} mensagens (limite 1200)</span><label class="field">Filtro<select id="logFilter"><option value="ALL" ${st.logFilter==='ALL'?'selected':''}>Tudo</option><option value="RX" ${st.logFilter==='RX'?'selected':''}>RX</option><option value="TX" ${st.logFilter==='TX'?'selected':''}>TX</option><option value="SYS" ${st.logFilter==='SYS'?'selected':''}>Sistema</option></select></label></div>
 <div class="log-records" id="logRecords">${logRows()}</div>
 <p class="note top-space">O ESP32 envia STATUS periodicamente. CAN LIST fornece apenas snapshots dos ultimos dados vistos pelo gateway. TX aqui significa comandos Bluetooth enviados pelo Android, nunca quadros transmitidos na CAN.</p></div>`;}


function safeSend(cmd){if(!window.AndroidBridge||!st.nativeConnected){toast('Conecte o ESP32 primeiro');return}window.AndroidBridge.send(cmd)}
function refreshLive(){
 if(st.preview)return;
 if(st.selected==='home'){
   const gauge=$('rpmGauge');if(gauge)gauge.innerHTML=dial();
   const vals=[...document.querySelectorAll('.metric .value')];
   if(vals[0])vals[0].innerHTML=currentSpeed()===null?'— <span class="unit">km/h</span>':`${currentSpeed().toFixed(1)} <span class="unit">km/h</span>`;
   if(vals[1])vals[1].textContent=currentAC();
   if(vals[2])vals[2].innerHTML=pressureText()+' <span class="unit">bar</span>';
   if(vals[3])vals[3].textContent=st.nativeConnected?'Conectado':'Offline';
 }
 if(st.selected==='ac'){
   const main=document.querySelector('.state-big');if(main)main.textContent=currentAC();
   const reason=document.querySelector('.card .muted.bottom-gap');if(reason)reason.textContent=st.live.acReason||'Aguardando o gateway';
   const sensorState=$('pressureSensorStateAc');if(sensorState)sensorState.textContent=st.live.sensorOK===true?'OK (informado)':st.live.sensorOK===false?'FALHA':'—';
   const sensorState2=$('pressureSensorStateAc2');if(sensorState2)sensorState2.textContent=st.live.sensorOK===true?'OK (informado)':st.live.sensorOK===false?'FALHA':'—';
   const sensorPermit=$('pressurePermitAc');if(sensorPermit)sensorPermit.textContent=st.live.acPermit===true?'LIBERADO':st.live.acPermit===false?'BLOQUEADO':'—';
   const pressure=$('pressureValueAc');if(pressure)pressure.textContent=pressureText();
   const sensorV=$('pressureVoltageAc');if(sensorV)sensorV.textContent=Number.isFinite(st.live.sensorV)?st.live.sensorV.toFixed(3)+' V':'—';
 }
 if(st.selected==='can'){
   const stats=document.querySelectorAll('.can-overview .stat strong');if(stats[0])stats[0].textContent=st.live.canIds??new Set(st.rx.map(f=>f.id)).size;
   if(stats[1])stats[1].textContent=st.rx.length;
   const list=document.querySelector('.card .list');if(list&&st.rx.length)list.innerHTML=Array.from(new Map([...st.rx].reverse().map(f=>[f.id,f])).values()).slice(0,12).map(rowFrame).join('');
 }
 const p=$('previewPill');if(p)p.innerHTML=st.nativeConnected?'<span class="dot green"></span> Conectado':'<span class="dot"></span> Offline';
}
function handleGateway(obj){
 if(obj.type==='status'){
   st.live.fw=obj.fw;
   st.live.rpm=obj.tach&&obj.tach.valid&&Number.isFinite(Number(obj.tach.rpm))?Number(obj.tach.rpm):null;
   st.live.acPermit=obj.ac&&typeof obj.ac.permit==='boolean'?obj.ac.permit:null;
   st.live.acReason=obj.ac?.reason||'';
   st.live.sensorOK=obj.sensor_ok;
   st.live.pressure=typeof obj.pressure==='number'&&Number.isFinite(obj.pressure)?obj.pressure:null;
   st.live.sensorV=typeof obj.sensor_v==='number'&&Number.isFinite(obj.sensor_v)?obj.sensor_v:null;
   st.live.lastStatus=Date.now();
   const logP=$('logPressureText');if(logP)logP.textContent=pressureText()+' bar';
   st.live.canOK=!!(obj.can?.ok);
   st.live.canIds=obj.can?.ids||0;
   st.live.vssHz=obj.vss_hz;
   refreshLive();
 }else if(obj.type==='can_list'){
   st.live.canIds=obj.frames?.length||0;
   const time=Date.now();
   for(const f of (obj.frames||[])){
     if(!/^0x[0-9a-f]+$/i.test(String(f.id||'')))continue;
     const ix=st.rx.findIndex(x=>x.id===f.id);if(ix>=0)st.rx.splice(ix,1);
     st.rx.push({id:f.id,data:String(f.data||''),hz:f.hz,ts:time});
     st.canHistory.push({id:String(f.id),data:String(f.data||''),hz:Number(f.hz)||0,ts:time,source:'CAN LIST snapshot'});
   }
   if(st.rx.length>500)st.rx.splice(0,st.rx.length-500);
   if(st.canHistory.length>3000)st.canHistory.splice(0,st.canHistory.length-3000);
   refreshLive();
 }else if(obj.type==='discovery'){
   st.live.discoveryPhase=obj.phase;
   st.live.discoveryCandidates=Array.isArray(obj.candidates)?obj.candidates:[];
   const candidates=$('candidateList');
   if(candidates&&st.live.discoveryCandidates.length){
     candidates.innerHTML=st.live.discoveryCandidates.slice(0,14).map(c=>`<div class="list-item"><div><strong>${esc(c.id)}</strong><br><small>${esc(c.format||'?')} · byte ${Number(c.byte)||0} · score ${Number(c.score).toFixed(1)}</small></div><button class="btn ghost" data-action="candidate" data-id="${esc(c.id)}">Analisar</button></div>`).join('');
   }
 }else if(obj.type==='decoders'){
   const speed=(obj.items||[]).find(x=>x.valid&&/^(speed|velocidade|vss)/i.test(String(x.name||'')));
   st.live.speed=speed&&Number.isFinite(Number(speed.value))?Number(speed.value):null;
   refreshLive();
 }else if(obj.type==='error'){toast('Gateway: '+String(obj.msg||'comando não aceito'))}
}
window.stiloNative={onEvent(evt){
 try{
   if(evt.type==='connected'){
     st.nativeConnected=true;st.gatewayName=evt.name||'STILO_OVERBOOST';st.preview=false;store();captureLog('SYS','Conectado a '+st.gatewayName);render();toast('Bluetooth conectado');return;
   }
   if(evt.type==='disconnected'){
     captureLog('SYS','Gateway desconectado');st.nativeConnected=false;st.live={};st.rx=[];render();toast('Bluetooth desconectado');return;
   }
   if(evt.type==='error'){captureLog('SYS','ERRO: '+String(evt.message||'Falha Bluetooth'));toast(String(evt.message||'Falha Bluetooth'));return;}
   if(evt.type==='tx'){captureLog('TX',evt.line);return;}
   if(evt.type==='gateway'){captureLog('RX',evt.line);handleGateway(JSON.parse(evt.line));}
 }catch(e){console.warn('Gateway:',e)}
}};

function nav(){const build=(mobile)=>menus.map(([id,title,icon])=>`<button data-route="${id}" class="${st.selected===id?'active':''}">${ico(icon)}<span>${title}</span></button>`).join('');$('desktopNav').innerHTML=build(false);$('mobileNav').innerHTML=build(true)}
function render(){document.body.classList.toggle('night',st.theme==='night');$('themeBtn').textContent=st.theme==='night'?'☀':'☾';const p=$('previewPill');p.classList.toggle('is-demo',st.preview);p.innerHTML=st.preview?'<span class="dot green"></span> Simulação':st.nativeConnected?'<span class="dot green"></span> Conectado':'<span class="dot"></span> Offline';nav();let captions={home:['PAINEL PRINCIPAL','Meu Stilo','Só o que você precisa acompanhar.'],ac:['CLIMATIZAÇÃO','Ar-condicionado','Pressão em bar, estados e permissivos.'],can:['REDE DO VEÍCULO','CAN Explorer','Capture. Identifique. Confirme.'],tools:['FERRAMENTAS','VSS / CAN TX','As funções avançadas ficam aqui.'],settings:['PREFERÊNCIAS','Ajustes','Personalize a central.'],monitor:['DIAGNÓSTICO','Monitor RX / TX','Mensagens Bluetooth enviadas e recebidas.']};let t=captions[st.selected];$('eyebrow').textContent=t[0];$('pagetitle').textContent=t[1];$('pagehint').textContent=t[2];const rendered={home:home,ac:ac,can:can,tools:tools,settings:settings,monitor:monitor}[st.selected]();$('content').innerHTML=rendered;if(st.selected==='tools')updateHz();}
function polar(a,r=112){const rad=a*Math.PI/180;return [175+r*Math.cos(rad),164+r*Math.sin(rad)]}
function arc(a,b,r=112){const p=polar(a,r),q=polar(b,r);return `M ${p[0].toFixed(2)} ${p[1].toFixed(2)} A ${r} ${r} 0 ${b-a>180?1:0} 1 ${q[0].toFixed(2)} ${q[1].toFixed(2)}`}
function dial(){
 const raw=currentRPM(), rpm=raw===null?null:Math.max(0,Math.min(7000,Number(raw)||0)), ratio=rpm===null?0:rpm/7000;
 const ticks=Array.from({length:8},(_,v)=>{const a=140+260*v/7,p=polar(a,89),p1=polar(a,98),p2=polar(a,104);return `<line x1="${p1[0]}" y1="${p1[1]}" x2="${p2[0]}" y2="${p2[1]}" stroke="#7192c7" stroke-width="2"/><text x="${p[0]}" y="${p[1]+4}" text-anchor="middle" fill="#a2bad8" font-size="13" font-weight="650">${v}</text>`}).join('');
 const progress=ratio>0?`<path d="${arc(140,140+260*ratio)}" fill="none" stroke="#51a5ff" stroke-width="14" stroke-linecap="round"/>`:'';
 const tip=polar(140+260*ratio);const pointer=rpm!==null?`<circle cx="${tip[0]}" cy="${tip[1]}" r="8" fill="#7bd6ff" stroke="#fff" stroke-width="2"/>`:'';
 return `<div class="card meter"><div class="meter-top"><span class="tiny-label">TACÔMETRO ${inf('rpm')}</span><span class="ghost">OCTTANE → ESP32</span></div><div class="dial"><svg viewBox="0 0 350 282" role="img" aria-label="Tacômetro de 0 a 7000 rotações por minuto"><path d="${arc(140,400)}" fill="none" stroke="#263e63" stroke-width="14" stroke-linecap="round"/>${progress}<path d="${arc(140+260*6000/7000,400)}" fill="none" stroke="#ff785f" stroke-width="7" stroke-linecap="round"/>${ticks}${pointer}</svg><div class="dial-center"><strong>${rpm===null?'—':Math.round(rpm).toLocaleString('pt-BR')}</strong><span>RPM</span></div></div><div class="meter-note"><span>Origem: tacômetro Octtane</span><strong>${rpm===null?'Aguardando sinal':st.preview?'Simulação':'Sinal recebido'}</strong></div><div class="meter-bar">${Array.from({length:20},(_,i)=>`<span class="${i<ratio*20?'on':''}"></span>`).join('')}</div></div>`}
function metric(name,html,footer,topic){return `<div class="card metric"><div class="label">${name} ${topic?inf(topic):''}</div><div class="value">${html}</div><div class="footer">${footer}</div></div>`}
function home(){let v=currentSpeed();return `${label('Visão geral','preview')}<div class="dashboard"><div id="rpmGauge">${dial()}</div><div class="metrics">${metric('VELOCIDADE',v===null?'— <span class="unit">km/h</span>':v+' <span class="unit">km/h</span>','Rede CAN','speed')}${metric('A/C LIBERAÇÃO',`<span style="font-size:23px">${currentAC()}</span>`,'Permissivo, não compressor ligado','ac')}${metric('PRESSÃO A/C',`${pressureText()} <span class="unit">bar</span>`,'Leitura do gateway • confira sensor','pressure')}${metric('GATEWAY','<span style="font-size:24px">'+(st.preview?'Simulado':st.nativeConnected?'Conectado':'Offline')+'</span>','Bluetooth SPP','preview')}</div></div><div class="quick"><div class="device-chip"><div class="device-icon">⌁</div><div><strong>STILO_OVERBOOST</strong><span>${st.preview?'Dados simulados':st.nativeConnected?'Conectado ao ESP32':'Aguardando conexão com ESP32'}</span></div></div><div class="connect-area"><button class="btn secondary native-only" data-action="bt-connect">Conectar Bluetooth</button><button class="btn ghost" data-route="monitor">Monitor RX / TX →</button></div></div>`}

function ac(){let msg=st.preview?(st.acRequested&&!st.pressureOK?'Pressão fora da faixa':st.acRequested?'Permissivos simulados válidos':'Sistema em espera'):(st.nativeConnected?(st.live.acReason||'Sem diagnóstico'):'Aguardando o gateway');let tag=st.preview?(st.pressureOK?'OK':'BLOQUEIO'):(st.live.sensorOK===true?'OK (informado)':st.live.sensorOK===false?'FALHA':'—');return `<div class="columns"><div class="card"><div class="section-title"><h2>Pressão do A/C</h2>${inf('pressure')}</div><div class="pressure-hero"><span id="pressureValueAc">${pressureText()}</span><small>bar</small></div><p class="note">${st.preview?'Valor de simulação; não veio do ESP32.':'Leitura calculada e reportada pelo ESP32. Sensor desconectado pode flutuar e gerar um número falso.'}</p><div class="statusline top-space"><span>Tensão do sensor (ADC)</span><strong id="pressureVoltageAc">${Number.isFinite(st.live.sensorV)?st.live.sensorV.toFixed(3)+' V':'—'}</strong></div><div class="statusline"><span>Estado reportado do sensor</span><strong id="pressureSensorStateAc">${tag}</strong></div></div><div class="card"><div class="minilabel">PERMISSIVO A/C ${inf('ac')}</div><div class="state-big ${currentAC()==='Bloqueado'?'status-alert':'status-muted'}">${currentAC()}</div><p class="muted bottom-gap">${esc(msg)}</p><div class="actions">${st.preview?`<button class="btn primary" data-action="ac-on">Simular pedido</button><button class="btn ghost" data-action="ac-off">Desligar simulação</button>`:`<button class="btn secondary" data-action="ac-refresh">Atualizar status</button>`}</div><div class="subtle-divider"></div><div class="section-title"><h3>Permissivos</h3></div><div class="statusline"><span>Pressostato informado</span><strong id="pressureSensorStateAc2">${tag}</strong></div><div class="statusline"><span>Liberação</span><strong id="pressurePermitAc">${st.preview?(st.pressureOK?'OK':'BLOQUEADO'):(st.live.acPermit===true?'LIBERADO':st.live.acPermit===false?'BLOQUEADO':'—')}</strong></div><div class="statusline"><span>Pedido de A/C</span><strong>${st.preview?(st.acRequested?'ATIVO':'DESLIGADO'):'NÃO DISPONÍVEL'}</strong></div><div class="statusline"><span>Saída do compressor</span><strong>${st.preview?(st.acRequested&&st.pressureOK?'SIMULADA':'INATIVA'):'NÃO MONITORADA'}</strong></div></div></div><p class="note top-space">⚠️ “Liberado” é apenas o estado lógico do ESP32. Antes de acionar o compressor, instale a polarização adequada e valide a detecção de sensor aberto; sem sensor, GPIO34 pode flutuar.</p>${st.preview?`<div class="quick"><div><strong>Teste de pressostato</strong><span>Simule uma falha para conferir a interface.</span></div><button class="switch ${st.pressureOK?'active':''}" data-action="pressure">${st.pressureOK?'Pressão OK':'Pressão baixa/alta'}</button></div>`:''}`}

function rowFrame(frame,i){let id=esc(frame.id),data=esc(frame.data),hz=frame.hz||'—';return `<div class="list-item"><div><strong>${id}</strong><br><small>${data}</small></div><span class="tag neutral">${hz} Hz</span></div>`}
function can(){const idCount=st.preview?new Set(st.rx.map(f=>f.id)).size:(st.live.canIds||new Set(st.rx.map(f=>f.id)).size);let candidates=Object.entries(st.signals);return `<div class="card bottom-gap"><div class="section-title"><h2>Leitura CAN</h2>${inf('can')}</div><div class="can-overview"><div class="stat"><strong>${idCount}</strong><span>IDs registrados</span></div><div class="stat"><strong>${st.rx.length}</strong><span>Mensagens</span></div><div class="stat"><strong>${candidates.length}</strong><span>Sinais confirmados</span></div></div><div class="actions top-space"><button class="btn secondary" data-action="capture">${st.capturing?"Parar atualização":"Atualizar IDs"}</button><button class="btn ghost" data-action="import">Importar log</button><button class="btn ghost" data-action="export">Exportar mapa</button><button class="btn secondary" data-action="can-export">Exportar CAN RX</button></div><div class="subtle-divider"></div><div class="section-title"><h3>IDs encontrados</h3></div><div class="list">${st.rx.length?Array.from(new Map([...st.rx].reverse().map(f=>[f.id,f])).values()).slice(0,12).map(rowFrame).join(''):`<div class="empty"><span class="empty-icon">⌁</span>Nenhuma mensagem recebida.<br><small>Importe um log para começar a identificar os sinais.</small></div>`}</div></div><details class="advanced"><summary>Descoberta e identificação de sinais ${inf('discovery')}</summary><div class="advanced-body"><div class="toolbar"><button class="btn secondary preview-only" data-action="sample-can">Carregar amostra</button><button class="btn ghost" data-action="event">Marcar evento</button><button class="btn ghost" data-action="analyze">Analisar IDs</button><button class="btn ghost native-only" data-action="discover-speed">Descobrir velocidade</button><button class="btn ghost native-only" data-action="discover-stop">Encerrar busca</button></div><div class="note top-space">Registre condições conhecidas e compare os frames. Confirme um sinal somente após ensaios repetidos.</div><div class="subtle-divider"></div><div class="section-title"><h3>Candidatos</h3></div><div id="candidateList">${suggestions()}</div><div class="subtle-divider"></div><h3 class="bottom-gap">Mapa confirmado</h3><div class="list">${candidates.length?candidates.map(([k,v])=>`<div class="list-item"><strong>${esc(k)}</strong><span>${esc(typeof v==='object'?`${v.id} • byte ${v.byte}`:v)}</span>${st.nativeConnected&&typeof v==='object'?`<button class="btn secondary" data-action="apply-decoder" data-signal="${esc(k)}">Aplicar</button>`:''}</div>`).join(''):'<small>Nenhum sinal confirmado.</small>'}</div></div></details>`}
function suggestions(){if(!st.rx.length)return '<p class="note">Capture ou importe dados e clique em “Analisar IDs”.</p>';return '<p class="note">Clique em “Analisar IDs” para ver sugestões baseadas nos frames.</p>'}
function tools(){return `${label('Sinal de velocidade','vss')}<div class="card bottom-gap"><div class="minilabel">CAN → ESP32 → OPTOACOPLADOR → OCTTANE</div><div class="fields cols3 top-space"><label class="field">Velocidade para cálculo (km/h)<input id="speed" type="number" min="0" max="250" value="${st.speed}"></label><label class="field">Pneu (firmware atual)<input value="195/55 R15" disabled></label><label class="field">Pulsos por volta (firmware atual)<input value="40" disabled></label></div><div class="subtle-divider"></div><div class="columns" style="align-items:center"><div><div class="minilabel">FREQUÊNCIA VSS ESTIMADA</div><div class="state-big" id="hzValue">— Hz</div><p class="note">Saída prevista: GPIO32. ${st.signals.Velocidade?'ID de velocidade anotado no mapa.':'Falta confirmar o ID de velocidade.'}</p></div><div><div class="actions"><button class="btn secondary" data-action="vss-output">Ver configuração</button><button class="btn ghost native-only" data-action="vss-off">VSS OFF</button><button class="btn ghost native-only" data-action="vss-on">VSS ON</button>${inf('vss')}</div><div class="output top-space" id="vssCommand">ROLE SPEED &lt;decoder&gt;\nVSS ON</div></div></div></div><details class="advanced bottom-gap"><summary>Transmissão CAN — avançado ${inf('tx')}</summary><div class="advanced-body"><div class="alert">Ferramenta para configuração e testes em barramento isolado. Transmissão para a rede do veículo permanece bloqueada nesta prévia.</div><div class="fields cols3 top-space"><label class="field">ID CAN (11 bits)<input id="txId" value="${esc(st.txId)}"></label><label class="field">DLC (0–8)<input id="txDlc" type="number" min="0" max="8" value="${st.txDlc}"></label><label class="field">Bytes HEX<input id="txBytes" value="${esc(st.txBytes)}"></label></div><div class="actions top-space"><button class="btn secondary" data-action="tx-prepare">Validar frame</button><button class="btn ghost" data-action="tx-copy">Copiar proposta</button></div><div id="txResult" class="output top-space">Configure um frame e clique em Validar.</div></div></details><details class="advanced"><summary>Comandos do gateway ${inf('settings')}</summary><div class="advanced-body"><div class="actions"><button class="btn ghost" data-action="show-command" data-value="STATUS">STATUS</button><button class="btn ghost" data-action="show-command" data-value="CAN LIST">CAN LIST</button><button class="btn ghost" data-action="show-command" data-value="DEC LIST">DEC LIST</button><button class="btn ghost" data-action="show-command" data-value="VSS OFF">VSS OFF</button><button class="btn ghost" data-action="show-command" data-value="CAN LISTEN">CAN LISTEN</button></div><div class="output top-space" id="gatewayCmd">Escolha um comando.</div></div></details>`}
function settings(){return `<div class="columns"><div class="card"><div class="section-title"><h2>Aparência</h2>${inf('settings')}</div><div class="statusline"><span>Tema</span><button class="btn ghost" data-action="theme">${st.theme==='light'?'Claro':'Escuro'} ↔</button></div><div class="statusline"><span>Pré-visualizar dados</span><button class="switch ${st.preview?'active':''}" data-action="preview">${st.preview?'Ligado':'Desligado'}</button></div>${st.preview?`<label class="field top-space">Cenário <select id="scenario"><option ${st.scenario==='Parado'?'selected':''}>Parado</option><option ${st.scenario==='Em movimento'?'selected':''}>Em movimento</option><option ${st.scenario==='Acelerando'?'selected':''}>Acelerando</option></select></label>`:''}</div><div class="card"><div class="section-title"><h2>Dados e configurações</h2>${inf('settings')}</div><div class="list-item"><div><strong>Gateway</strong><br><small>STILO_OVERBOOST · ${esc(st.live.fw||'V3.0.2')}</small></div><span class="tag neutral">${st.nativeConnected?'Conectado':'Offline'}</span></div><div class="actions top-space"><button class="btn secondary" data-action="export">Exportar mapa CAN</button><button class="btn ghost" data-route="monitor">Monitor RX / TX</button><button class="btn ghost" data-action="clear">Limpar dados locais</button></div><div class="actions top-space native-only"><button class="btn primary" data-action="bt-connect">Conectar Bluetooth</button><button class="btn ghost" data-action="bt-disconnect">Desconectar</button></div><p class="note top-space">${st.nativeConnected?`Conectado a ${esc(st.gatewayName)}. Firmware ${esc(st.live.fw||'aguardando')}.`:(window.AndroidBridge?'Selecione o ESP32 já pareado nas configurações Bluetooth do celular.':'Abra o APK Android para comunicação Bluetooth real.')}</p></div></div>`}
function circumference(){return Math.PI*((15*25.4+2*195*.55)/1000)}
function updateHz(){const input=$('speed'),hz=$('hzValue');if(!input||!hz)return;let km=Math.max(0,Number(input.value)||0);st.speed=km;let f=(km/3.6)/circumference()*40;hz.textContent=f.toFixed(1)+' Hz';let cmd=$('vssCommand');if(cmd)cmd.textContent=`ROLE SPEED <índice do decoder>\nVSS ON\nVelocidade: ${km} km/h  |  Aproximadamente ${f.toFixed(1)} Hz`;}
function validateTx(){let idTxt=($('txId')?.value||'').trim(),dlc=Number($('txDlc')?.value),src=($('txBytes')?.value||'').trim();let id=/^0x/i.test(idTxt)?parseInt(idTxt.slice(2),16):/^\d+$/.test(idTxt)?Number(idTxt):NaN,bytes=src?src.split(/[\s,;]+/):[];let err='';if(!Number.isInteger(id)||id<0||id>0x7ff)err='ID padrão fora da faixa de 11 bits (0x000–0x7FF).';else if(!Number.isInteger(dlc)||dlc<0||dlc>8)err='DLC deve ser de 0 a 8.';else if(bytes.length!==dlc||bytes.some(x=>!/^[0-9a-f]{2}$/i.test(x)))err=`Informe exatamente ${dlc} bytes HEX de dois dígitos.`;let cmd=err?'ERRO: '+err:`TX ONCE 0x${id.toString(16).toUpperCase()} ${dlc}${bytes.length?' '+bytes.join(' ').toUpperCase():''}\n(Apenas prévia — não transmitido)`; st.txId=idTxt;st.txDlc=dlc;st.txBytes=src;let out=$('txResult');if(out)out.textContent=cmd;return {cmd,err}}
function sample(){st.rx=[];const ts=Date.now();for(let n=0;n<90;n++){let speed=Math.max(0,Math.min(140,Math.round(n*0.7)));let rpm=800+Math.round(speed*28);let motor=rpm*4,sp=speed*100,door=(n>35&&n<47)?1:0;st.rx.push({id:'0x280',data:`00 00 00 ${(n>40?1:0).toString(16).padStart(2,'0')} 00 00 00 00`.toUpperCase(),hz:20,ts:ts+n*40});st.rx.push({id:'0x315',data:`${(sp&255).toString(16).padStart(2,'0')} ${(sp>>8&255).toString(16).padStart(2,'0')} 00 00 00 00 00 00`.toUpperCase(),hz:20,ts:ts+n*40});st.rx.push({id:'0x402',data:`00 00 00 ${door.toString(16).padStart(2,'0')} 00 00 00 00`.toUpperCase(),hz:6,ts:ts+n*40});}st.rx.push({id:'0x520',data:'0A FF 00 7E 01 00 00 00',hz:2,ts:ts+4000});toast(st.rx.length+' mensagens ilustrativas carregadas');render()}
function analyze(){if(!st.rx.length){toast('Capture ou importe mensagens primeiro');return}let unique=[...new Map(st.rx.map(f=>[f.id,f])).values()];const msgs=unique.slice(0,12).map((f,i)=>`<div class="list-item"><div><strong>${esc(f.id)}</strong><br><small>${esc(f.data)}</small></div><button class="btn secondary" style="min-height:30px;padding:7px 10px" data-action="candidate" data-id="${esc(f.id)}">Investigar</button></div>`).join('');$('candidateList').innerHTML='<div class="note bottom-gap">Propostas para investigação. A confirmação deve ocorrer após teste repetido.</div><div class="list">'+msgs+'</div>';toast('Candidatos listados para validação')}
function parseFrames(raw){let out=[];try{let obj=JSON.parse(raw);let arr=Array.isArray(obj)?obj:(obj.frames||obj.items||[]);if(Array.isArray(arr)){for(let o of arr){let id=o.id??o.canId??o.can_id;let data=o.data??o.bytes;if(id===undefined||data===undefined)continue;let bytes=Array.isArray(data)?data.map(n=>Number(n).toString(16).padStart(2,'0')):String(data).trim().split(/[,\s]+/);out.push({id:String(id),data:bytes.join(' ').toUpperCase(),hz:o.hz||'—',ts:o.ts||o.t||Date.now()})}if(out.length)return out}}catch{}let lines=raw.split(/\r?\n/);for(let line of lines){let match=line.match(/(0x[0-9a-fA-F]{2,8})\s*[;,\s]+((?:[0-9a-fA-F]{2}[,;\s]+){0,7}[0-9a-fA-F]{2})/);if(match)out.push({id:match[1],data:match[2].replace(/[,;]+/g,' ').trim().toUpperCase(),hz:'—',ts:Date.now()})}return out}
function exportMap(){exportJson('stilo-overboost-can-map.json',{version:'0.4.2',source:st.nativeConnected?'gateway-connected':st.preview?'simulation':'local-offline',firmware:st.live.fw||null,created_at:new Date().toISOString(),confirmed_signals:st.signals,notes:'Mapa local de sinais confirmados. Para mensagens reais, use Exportar CAN RX ou Monitor RX/TX.'});}
function applyDecoder(name){
 const cfg=st.signals[name];if(!cfg||!st.nativeConnected){toast('Conecte o gateway e valide o sinal');return}
 if(!/^(Velocidade|Speed)$/i.test(name)){modal('Decodificador','Esta interface aplica automaticamente apenas o decodificador de velocidade confirmado. Outros sinais podem ser salvos no mapa.');return}
 if(!/^0x[0-9A-F]{1,3}$/i.test(cfg.id)){toast('ID inválido');return}
 const slotInput=prompt('Índice livre do decodificador no gateway (0 a 15)', '0');if(slotInput===null)return;const slot=Number(slotInput);
 if(!Number.isInteger(slot)||slot<0||slot>15){toast('Índice inválido');return}
 if(!Number.isInteger(cfg.byte)||!Number.isInteger(cfg.bytes)||cfg.bytes<1||cfg.bytes>4||cfg.byte+cfg.bytes>8){toast('Bytes inválidos');return}
 if(!Number.isFinite(cfg.factor)||!Number.isFinite(cfg.offset)){toast('Escala inválida');return}
 const mask=cfg.bytes===4?'0xFFFFFFFF':'0x'+((2**(cfg.bytes*8)-1).toString(16).toUpperCase());
 const command=`DEC SET ${slot} speed ${cfg.id} ${cfg.byte} ${cfg.bytes} ${cfg.endian==='BE'?'BE':'LE'} ${mask} 0 ${cfg.factor} ${cfg.offset} kmh 1200 1`;
 if(!confirm(`Aplicar o decodificador de velocidade ${cfg.id} no slot ${slot}?\nFator: ${cfg.factor}\nOffset: ${cfg.offset}\n\nAtenção: confirme que comparou com uma referência independente. O VSS não será ativado nesta etapa.`))return;
 safeSend(command);
 setTimeout(()=>safeSend(`ROLE SPEED ${slot}`),300);
 setTimeout(()=>safeSend('DEC SAVE'),600);
 setTimeout(()=>safeSend('DEC LIST'),1000);
 toast('Configuração enviada; confira resposta do gateway');
}
function candidate(id){
  // Registration is intentionally conservative: an ID alone is not a decoder.
  let type=prompt(`ID ${id}\nQual sinal foi confirmado? (ex.: Velocidade ou Porta)`,'');
  if(!type)return;
  let pos=prompt('Byte inicial (0 a 7). Cancelar mantém o ID sem confirmação.','0');if(pos===null)return;
  let length=prompt('Quantidade de bytes (1 a 4)','2');if(length===null)return;
  let factor=prompt('Fator de multiplicação verificado','1');if(factor===null)return;
  let offset=prompt('Offset verificado','0');if(offset===null)return;
  let byte=Number(pos),bytes=Number(length),scale=Number(factor),add=Number(offset);
  if(!Number.isInteger(byte)||byte<0||byte>7||!Number.isInteger(bytes)||bytes<1||bytes>4||byte+bytes>8||!Number.isFinite(scale)||!Number.isFinite(add)){
    toast('Configuração inválida; nenhum sinal foi salvo');return;
  }
  const valid=confirm(`Confirmação manual: ${type}\nID: ${id}\nByte: ${byte}\nBytes: ${bytes}\nFator: ${scale}\nOffset: ${add}\n\nVocê validou o sinal em ensaios repetidos com referência externa?`);
  if(!valid){toast('Candidato não confirmado');return;}
  st.signals[type]={id,byte,bytes,endian:'LE',factor:scale,offset:add,validation:'manual'};
  store();render();toast('Sinal confirmado manualmente');
}
window.addEventListener('click',e=>{const el=e.target.closest('[data-action],[data-route],[data-help]');if(!el)return;if(el.hasAttribute('data-route')){st.selected=el.dataset.route;if(st.nativeConnected){if(st.selected==='can')safeSend('CAN LIST');if(st.selected==='home')safeSend('DEC LIST')}render();window.scrollTo({top:0,behavior:'instant'});return}if(el.hasAttribute('data-help')){e.stopPropagation();const key=el.dataset.help;modal('Sobre esta função',infos[key]||'Detalhes desta função.');return}let a=el.dataset.action;switch(a){case 'close-modal':$('modal').classList.remove('open');break;case 'bt-connect':if(window.AndroidBridge)window.AndroidBridge.chooseDevice();else toast('Bluetooth disponível no APK Android');break;case 'bt-disconnect':if(window.AndroidBridge)window.AndroidBridge.disconnect();break;case 'ac-refresh':safeSend('AC STATUS');break;case 'discover-speed':safeSend('DISCOVER START SPEED');toast('Descoberta iniciada');break;case 'discover-stop':safeSend('DISCOVER STOP');toast('Descoberta encerrada');break;case 'vss-off':safeSend('VSS OFF');break;case 'vss-on':if(confirm('Somente após validar o decodificador de velocidade e medir o sinal no GPIO32 em bancada. Habilitar VSS?'))safeSend('VSS ON');break;case 'apply-decoder':applyDecoder(el.dataset.signal);break;case 'theme':st.theme=st.theme==='light'?'night':'light';store();render();break;case 'preview':st.preview=!st.preview;store();render();break;case 'pressure':st.pressureOK=!st.pressureOK;store();render();break;case 'ac-on':if(!st.preview){modal('A/C sem conexão','No HTML de prévia, o pedido não é enviado. Para testar a aparência, ative a simulação em Ajustes.');break}st.acRequested=true;store();render();toast(st.pressureOK?'Pedido simulado':'Bloqueado pelo pressostato simulado');break;case 'ac-off':if(!st.preview){modal('A/C sem conexão','No HTML de prévia, o pedido não é enviado.');break}st.acRequested=false;store();render();toast('Desligado na prévia');break;case 'capture':st.capturing=!st.capturing;if(st.nativeConnected){safeSend('CAN LIST');toast(st.capturing?'Atualização CAN ligada':'Atualização CAN parada')}else toast(st.capturing?'Aguardando dados ou importação':'Captura encerrada');render();break;case 'import':$('fileInput').click();break;case 'export':exportMap();break;case 'can-export':exportCanCapture();break;case 'monitor-export':exportMonitor();break;case 'monitor-clear':if(confirm('Apagar as mensagens RX/TX desta sessao?')){st.monitorHistory=[];updateMonitor()}break;case 'monitor-pause':st.logPaused=!st.logPaused;render();break;case 'monitor-status':safeSend('STATUS');break;case 'monitor-can':safeSend('CAN LIST');break;case 'sample-can':sample();break;case 'event':{if(st.nativeConnected)safeSend('DISCOVER MARK');let label=prompt('Qual evento você executou? (ex.: porta aberta, motor ligado)','Porta aberta');if(label){st.events.push({label,ts:Date.now(),count:st.rx.length});toast('Evento registrado: '+label)}break;}case 'analyze':analyze();break;case 'candidate':candidate(el.dataset.id);break;case 'vss-output':modal('Configuração VSS',`Firmware V3.0.2:\n- ROLE SPEED <índice> define o decoder de velocidade.\n- VSS ON habilita a saída GPIO32.\n- O optoacoplador deve ser dimensionado e validado para a entrada da Octtane.\n- A simulação aqui apenas calcula a frequência.`);break;case 'tx-prepare':validateTx();break;case 'tx-copy':{let o=validateTx();if(o.err){toast('Corrija o frame antes de copiar');break}if(navigator.clipboard&&window.isSecureContext){navigator.clipboard.writeText(o.cmd.split('\n')[0]).then(()=>toast('Proposta copiada')).catch(()=>toast('Não foi possível copiar'))}else{let t=document.createElement('textarea');t.value=o.cmd.split('\n')[0];document.body.appendChild(t);t.select();try{document.execCommand('copy');toast('Proposta copiada')}catch{toast('Selecione o texto para copiar')}t.remove()}break;}case 'show-command':$('gatewayCmd').textContent=el.dataset.value+'\n(comando de referência; não enviado)';break;case 'clear':if(confirm('Limpar dados e mapa local?')){try{localStorage.removeItem('stilo-slim-v04')}catch{};st={...initial,nativeConnected:st.nativeConnected,gatewayName:st.gatewayName,live:st.live,monitorHistory:st.monitorHistory,canHistory:st.canHistory,logSeq:st.logSeq,rx:[],events:[],capturing:false,signals:{},confirmed:[]};render();toast('Preferências restauradas')}break}
});
$('modal').addEventListener('click',e=>{if(e.target===$('modal'))$('modal').classList.remove('open')});window.addEventListener('keydown',e=>{if(e.key==='Escape')$('modal').classList.remove('open')});window.addEventListener('input',e=>{if(e.target.id==='speed')updateHz();if(['txId','txDlc','txBytes'].includes(e.target.id))validateTx()});window.addEventListener('change',e=>{if(e.target.id==='logFilter'){st.logFilter=e.target.value;updateMonitor();}if(e.target.id==='scenario'){st.scenario=e.target.value;store();render()}if(e.target.id==='fileInput'){let f=e.target.files[0];if(!f)return;const reader=new FileReader();reader.onload=()=>{let parsed=parseFrames(String(reader.result));if(!parsed.length){toast('Nenhum frame reconhecido no arquivo');return}st.rx=parsed.slice(0,30000);render();toast(st.rx.length+' frames importados')};reader.readAsText(f);e.target.value=''}});
render();updateHz();window.stiloPreview={nav:(id)=>{st.selected=id;render()},getState:()=>st,sample};
})();
</script></body></html>
